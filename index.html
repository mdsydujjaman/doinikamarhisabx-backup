<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#0A1931">
  <title>দৈনিক আমার হিসাবX — Step 00</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;
      padding:20px;background:#0A1931;color:#fff;
      font-family:system-ui,"Noto Sans Bengali",sans-serif}
    main{width:100%;max-width:520px;padding:28px 22px;
      border:1px solid #185ADB;border-radius:22px;
      background:linear-gradient(145deg,#12294b,#0b1730);
      box-shadow:0 12px 32px #0006;text-align:center}
    h1{font-size:clamp(25px,6vw,36px);margin:0 0 12px}
    p{line-height:1.8;color:#dce9ff}
    .step{margin-top:24px;padding:16px;border-radius:14px;
      background:#185ADB;font-weight:700}
    .tag{color:#4CC9F0;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="tag">STEP 00 — FOUNDATION</div>
    <h1>দৈনিক আমার হিসাবX</h1>
    <p>দৈনিক আয়-ব্যয় ও লেনদেনের সহজ হিসাব</p>
    <p>আপনার সব হিসাব, এক অ্যাপ</p>
    <div class="step">নতুন প্রকল্পের ভিত্তি প্রস্তুত করা হচ্ছে</div>
    <p>বাংলা-প্রথম · মোবাইল-প্রথম · অফলাইন-প্রথম · হালকা ও সহজ</p>
    <p>এখনো কোনো হিসাবের ফিচার চালু হয়নি।</p>
  </main>
</body>
</html>
